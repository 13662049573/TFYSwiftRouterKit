name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate package manifest
        run: swift package dump-package > /dev/null
      - name: Validate podspec
        run: pod spec lint TFYSwiftRouterKit.podspec --quick --allow-warnings
      - name: Test Swift package
        run: swift test
      - name: Check public API compatibility
        run: |
          router_baseline="$(git describe --tags --abbrev=0 HEAD^)"
          if git show "${router_baseline}:Package.swift" | grep -q '\.macOS'; then
            swift package diagnose-api-breaking-changes "$router_baseline"
          else
            echo "::notice::Skipping host API check for legacy baseline ${router_baseline}; it has no macOS platform declaration."
          fi
      - name: Build iOS app and tests with device SDK
        run: >-
          xcodebuild build-for-testing
          -project TFYSwiftRouterKit.xcodeproj
          -scheme TFYSwiftRouterKit
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
